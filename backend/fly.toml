# fly.toml app configuration file for SIRH-MFN Backend (Capítulo V)
# See https://fly.io/docs/reference/configuration/

app = 'sirh-mfn-backend'
primary_region = 'mia'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
